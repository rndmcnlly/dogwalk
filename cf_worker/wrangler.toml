name = "dogwalk"
main = "src/index.ts"
compatibility_date = "2026-07-20"
workers_dev = true

routes = [
  { pattern = "dogwalk.tools", custom_domain = true }
]

# Voice Agent Skills and the docs they embed are bundled as text modules.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Spoken earcons rendered by make_earcons.py are bundled as binary.
[[rules]]
type = "Data"
globs = ["**/*.pcm"]
fallthrough = true

[vars]
# Set after creating the path-scoped Cloudflare Access application.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
OPENAI_PROJECT_ID = "proj_jignpSyHyE5k18M1EGYS9Ijx"
OPENAI_LIVE_MODEL = "gpt-live-1"
ORCHESTRATOR_MODEL = "gpt-6.1-sol"
ORCHESTRATOR_REASONING_EFFORT = "low"
# Mirrors the hard monthly limit on the OpenAI Dogwalk project (issue #57): the spend ledger
# measures against it, and the Opening mentions it past 75%. Change both together.
DOGWALK_MONTHLY_BUDGET_USD = "80"
PUBLIC_ORIGIN = "https://dogwalk.tools"
# Name of a pre-built Daytona snapshot containing OpenCode and the Agent Gateway.
DAYTONA_SNAPSHOT = "dogwalk-agent-20261112-v1"
# Name of the org Daytona Secret mapped to OPENAI_API_KEY for sandbox Agents; it holds the
# OpenAI key dogwalk-sandbox-agents in the Dogwalk project.
DAYTONA_AGENT_SECRET = "dogwalk-openai"
# Stamped on every observation. The integration tests override it; so should a manual `wrangler dev`.
DEPLOYMENT_ENVIRONMENT = "production"
# Sandbox reaping (README: Sandbox Reaping): a daily pass over Sandboxes whose User has made no
# Voice Call for this many days. Anything but "delete" is a dry run that audits candidates only.
SANDBOX_REAP_AGE_DAYS = "30"
SANDBOX_REAP_MODE = "delete"
# Roaming admission (README: Identity Check): "on" admits a caller who names a Handle and passes
# its three Identity Challenges. Anything else keeps Roaming in shadow mode, admitting nobody.
ROAMING_ADMISSION = "on"

# The Home check's name path (README: Identity Check): a Home call within this many hours of the
# User's last Voice Call, from any phone, asks for their Handle instead of a sentence. "0" turns it off.
HOME_NAME_WINDOW_HOURS = "24"

# Worker Version ID, stamped on observations as OTel service.version.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Bound in Spike 1. DB id is filled in after `wrangler d1 create dogwalk`
# is run on the adam@adamsmith.as account.
[[d1_databases]]
binding = "DB"
database_name = "dogwalk"
database_id = "f04230d7-172f-4a89-9556-2d3d62e8bf1a"

# Speaker verification Worker (speaker_worker/), reachable only through this RPC binding.
[[services]]
binding = "SPEAKER"
service = "dogwalk-speaker"
entrypoint = "SpeakerVerifier"

# Voice Donations: raw donated audio, private, unlinked to callers (src/voice_donation.ts).
[[r2_buckets]]
binding = "RESEARCH_AUDIO"
bucket_name = "dogwalk-voice-research"

[[durable_objects.bindings]]
name = "VOICE_SESSIONS"
class_name = "VoiceSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TerminalRelay"]

# Terminal access now opens Daytona's own web terminal through a signed preview URL.
[[migrations]]
tag = "v3"
deleted_classes = ["TerminalRelay"]

# TWILIO_AUTH_TOKEN is a Worker secret, set via:
#   wrangler secret put TWILIO_AUTH_TOKEN
# For local `wrangler dev`, put it in .dev.vars (gitignored).
# DAYTONA_API_KEY, DOGWALK_IDENTITY_SECRET, OPENAI_API_KEY (dogwalk-voice-frontend),
# ORCHESTRATOR_API_KEY (dogwalk-orchestrator), and OPENAI_WEBHOOK_SECRET are also Worker secrets.

# Observability: enable logs in the Cloudflare dashboard / wrangler tail.
[observability]
enabled = true

# Delayed provider logs must arrive even when no operator browser is open. The daily
# entry is the Sandbox reaping pass (SANDBOX_REAP_CRON in src/index.ts).
[triggers]
crons = ["* * * * *", "17 10 * * *"]
